<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Top bar -->
    <header class="topbar">
      <h2>Expense Tracker</h2>
      <button id="theme-toggle" class="btn-ghost" aria-label="Toggle theme">🌙 Dark</button>
    </header>

    <main class="container">
      <section class="card balance-card">
        <h4>Your Balance</h4>
        <h1 id="balance">₹0.00</h1>

        <div class="inc-exp-container">
          <div>
            <h4>Income</h4>
            <p id="money-plus" class="money money-plus">+₹0.00</p>
          </div>
          <div>
            <h4>Expense</h4>
            <p id="money-minus" class="money money-minus">-₹0.00</p>
          </div>
        </div>
      </section>

      <section class="card">
        <h3>History</h3>
        <ul id="list" class="list">
          <!-- Items injected here -->
        </ul>
      </section>

      <section class="card">
        <h3>Add New Transaction</h3>
        <form id="form">
          <div class="form-control">
            <label for="text">Text</label>
            <input type="text" id="text" placeholder="e.g., Salary / Groceries" />
          </div>
          <div class="form-control">
            <label for="amount">Amount <small>(negative = expense, positive = income)</small></label>
            <input type="number" id="amount" placeholder="e.g., 500 or -120" />
          </div>
          <button class="btn">Submit</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
